<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Code quality metrics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="barBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#292c3c"/>
    </linearGradient>
    <linearGradient id="uniqFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="55%" stop-color="#b4befe"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="330" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="330" fill="url(#bg)"/>

    <!-- 标题 -->
    <g font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace">
      <text x="56" y="58" fill="#cdd6f4" font-size="18" font-weight="700" letter-spacing="0.4">CODE QUALITY</text>
      <text x="56" y="79" fill="#585b70" font-size="11" letter-spacing="0.4">STATIC ANALYSIS · ALL REPOS</text>

      <text x="944" y="55" text-anchor="end" fill="#585b70" font-size="10" letter-spacing="0.4">QUALITY GATES</text>
      <text x="944" y="79" text-anchor="end" font-family="'JetBrains Mono',monospace">
        <tspan fill="#a6e3a1" font-size="16" font-weight="700">11</tspan><tspan fill="#45475a" font-size="11"> pass</tspan>
        <tspan fill="#45475a" font-size="11">   </tspan>
        <tspan fill="#f38ba8" font-size="16" font-weight="700">5</tspan><tspan fill="#45475a" font-size="11"> fail</tspan>
      </text>
    </g>

    <line x1="56" y1="100" x2="944" y2="100" stroke="#313244" stroke-width="1"/>

    <g font-family="'JetBrains Mono',ui-monospace,monospace">

      <!-- Uniqueness 4.70 — 主角，粗条 + 渐变色 + 大字号 -->
      <text x="56" y="140" fill="#cdd6f4" font-size="15" font-weight="700">Uniqueness</text>
      <text x="944" y="142" text-anchor="end" fill="#cba6f7" font-size="26" font-weight="700" letter-spacing="-0.5">4.70</text>
      <rect x="56" y="152" width="888" height="13" rx="6.5" fill="url(#barBase)"/>
      <rect x="56" y="152" width="835" height="13" rx="6.5" fill="url(#uniqFill)"/>

      <!-- 其余三项 4.x — 细条，同色系不同色相 -->
      <text x="56" y="203" fill="#a6adc8" font-size="13">Reliability</text>
      <text x="944" y="203" text-anchor="end" fill="#89b4fa" font-size="15">3.96</text>
      <rect x="56" y="212" width="888" height="7" rx="3.5" fill="url(#barBase)"/>
      <rect x="56" y="212" width="703" height="7" rx="3.5" fill="#89b4fa"/>

      <text x="56" y="243" fill="#a6adc8" font-size="13">Security</text>
      <text x="944" y="243" text-anchor="end" fill="#89dceb" font-size="15">4.32</text>
      <rect x="56" y="252" width="888" height="7" rx="3.5" fill="url(#barBase)"/>
      <rect x="56" y="252" width="767" height="7" rx="3.5" fill="#89dceb"/>

      <text x="56" y="283" fill="#a6adc8" font-size="13">Maintainability</text>
      <text x="944" y="283" text-anchor="end" fill="#94e2d5" font-size="15">4.58</text>
      <rect x="56" y="292" width="888" height="7" rx="3.5" fill="url(#barBase)"/>
      <rect x="56" y="292" width="813" height="7" rx="3.5" fill="#94e2d5"/>

    </g>
  </g>
</svg>
